name: Supabase Database Keep-Alive

on:
  schedule:
    # Runs every 2 days at 06:00 UTC to prevent 7-day inactivity pause
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Supabase & Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Ping MrFocus API Keep-Alive Endpoint
        run: |
          echo "Sending keep-alive request to Vercel production..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://mrfocus.vercel.app/api/keep-alive" \
            -H "User-Agent: github-actions-keep-alive/1.0")
          echo "$RESPONSE"
          
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Vercel ping returned status $STATUS"
          else
            echo "Vercel keep-alive ping succeeded with 200 OK!"
          fi

      - name: Direct REST Ping to Supabase Database
        run: |
          echo "Sending direct REST query to Supabase..."
          SUPABASE_URL="https://gguobcfciwcexnjbneik.supabase.co"
          ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdndW9iY2ZjaXdjZXhuamJuZWlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTEyNjgsImV4cCI6MjEwNDk2NzI2OH0.V01Cr131zioHdKZeRHbT0ydEbhW-_9c9o516vy-LRNA' }}"
          
          DB_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1")
          echo "$DB_RESPONSE"
          
          DB_STATUS=$(echo "$DB_RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$DB_STATUS" -ge 200 ] && [ "$DB_STATUS" -lt 300 ]; then
            echo "Direct Supabase database query successful! Inactivity timer reset."
          else
            echo "Direct query returned status $DB_STATUS"
          fi
